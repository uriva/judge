services:
  - type: web
    name: judge-court
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: judge-db
          property: connectionString
      - key: PROMPT2BOT_API_TOKEN
        sync: false
      - key: PROMPT2BOT_BOT_ID
        value: ddfea796-534c-4eb9-b824-d729dfe1f31c
      - key: PROMPT2BOT_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_JUDGE_BOT_KEY
        value: 
      - key: BASE_URL
        value: https://judge-court.onrender.com

databases:
  - name: judge-db
    databaseName: judge
    user: judge_user
    plan: free
